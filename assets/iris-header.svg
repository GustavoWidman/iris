  <text x="67" y="72" fill="#aaa7bb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="3">local light. two worlds.</text>
  <text x="62" y="190" fill="#f1ece8" font-family="Georgia, serif" font-size="110" letter-spacing="-5">iris</text>
  <text x="67" y="245" fill="#c7c2cc" font-family="system-ui, sans-serif" font-size="25">bring your BLE lights home.</text>
