    <linearGradient id="spectrum" x1="0" x2="1"><stop stop-color="#e4ad7c"/><stop offset=".38" stop-color="#d291b5"/><stop offset=".7" stop-color="#a394d1"/><stop offset="1" stop-color="#7caeaf"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9b84c7" stop-opacity=".15"/><stop offset="1" stop-color="#9b84c7" stop-opacity="0"/></radialGradient>
  </defs>
