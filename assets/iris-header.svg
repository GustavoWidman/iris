<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">iris — bring your BLE lights home</title>
  <desc id="desc">A soft violet rainbow arch connects a home outline and a tiny circuit board on a dark ink background.</desc>
